name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MoviesAPI.sln

      - name: Build
        run: dotnet build MoviesAPI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MoviesAPI.Tests/MoviesAPI.Tests.csproj --configuration Release --no-build
